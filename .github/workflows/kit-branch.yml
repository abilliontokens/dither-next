# Publishes `dither-kit/` at the root of the `kit` branch so consumers can
# depend on `github:abilliontokens/dither-next#<sha>` without pnpm's
# `&path:` subdirectory selector. Monorepo tooling such as `turbo prune`
# rewrites lockfiles and drops the `path` from git resolutions, which then
# installs this whole repository instead of the kit.
#
# `git subtree split` is deterministic: each run appends the new kit commits
# to the existing `kit` history, so the push is a fast-forward.
name: Publish kit branch

on:
  push:
    branches: [master]
    paths: ["dither-kit/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Split dither-kit/ onto the kit branch
        run: |
          git subtree split --prefix=dither-kit -b kit
          git push origin kit
